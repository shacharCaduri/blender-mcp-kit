[project]
name = "blender-mcp-kit"
version = "0.1.0"
description = "Modular MCP server for AI-driven 3D scene creation (Blender now, more engines later)"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
blender-mcp-kit = "engine_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine_mcp"]
